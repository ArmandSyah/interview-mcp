name: Windows installer preview

on:
  workflow_dispatch:
  push:
    branches: [main, feat/interview-desktop]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'apps/desktop/**'
      - 'server/**'
      - 'problems/examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/windows-install.md'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --dev --python 3.12
        working-directory: .
      - run: npm ci
      - run: npm run install:electron
      - run: npm run backend
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Select installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one installer, got $($installers.Count)" }
          "INTERVIEW_DESKTOP_INSTALLER=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test installation and saved-data retention
        run: npx playwright test --config playwright.installer.config.ts
      - name: Prepare preview download
        run: node scripts/windows-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: interview-workbench-windows-preview
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/build-info.json
            apps/desktop/release/INSTALL-WINDOWS.md
          if-no-files-found: error
          retention-days: 30
      - name: Keep installer test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-test-results
          path: apps/desktop/test-results-installer
          if-no-files-found: warn
